name: Reusable unsigned iOS IPA build

on:
  workflow_call:
    inputs:
      foundation_repository:
        description: "Owner/repository containing the shared packaging and validation contract"
        required: true
        type: string
      foundation_ref:
        description: "Immutable branch, tag, or commit for the foundation scripts"
        required: true
        type: string
      scheme:
        description: "Xcode scheme to build"
        required: true
        type: string
      project_path:
        description: "Project path relative to the app repository; leave empty when using a workspace"
        required: false
        default: ""
        type: string
      workspace_path:
        description: "Workspace path relative to the app repository; leave empty when using a project"
        required: false
        default: ""
        type: string
      configuration:
        description: "Xcode build configuration"
        required: false
        default: Release
        type: string
      app_name:
        description: "Expected root app bundle name, for example SideStoreSample.app"
        required: false
        default: ""
        type: string
      app_version:
        description: "Optional expected CFBundleShortVersionString"
        required: false
        default: ""
        type: string
      build_number:
        description: "Optional expected CFBundleVersion"
        required: false
        default: ""
        type: string
      minimum_os_version:
        description: "Optional fallback when MinimumOSVersion is absent from the built Info.plist"
        required: false
        default: ""
        type: string
      artifact_name:
        description: "Actions artifact name"
        required: false
        default: unsigned-ipa
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout deployment foundation
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.foundation_repository }}
          ref: ${{ inputs.foundation_ref }}
          path: foundation
          fetch-depth: 1

      - name: Record macOS and Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          xcode-select -p | tee "$RUNNER_TEMP/xcode-select-path.txt"
          sw_vers | tee "$RUNNER_TEMP/macos-version.txt"
          xcode_version="$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          runner_image="${ImageOS:-unknown}"
          if [[ -n "${ImageVersion:-}" ]]; then
            runner_image="$runner_image/${ImageVersion}"
          fi
          echo "XCODE_VERSION=$xcode_version" >> "$GITHUB_ENV"
          echo "RUNNER_IMAGE=$runner_image" >> "$GITHUB_ENV"

      - name: Build unsigned device app
        shell: bash
        env:
          APP_DIR: app
          PROJECT_PATH: ${{ inputs.project_path }}
          WORKSPACE_PATH: ${{ inputs.workspace_path }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          if [[ -n "$PROJECT_PATH" && -n "$WORKSPACE_PATH" ]]; then
            echo "Set only one of project_path or workspace_path" >&2
            exit 1
          fi
          if [[ -z "$PROJECT_PATH" && -z "$WORKSPACE_PATH" ]]; then
            echo "Set one of project_path or workspace_path" >&2
            exit 1
          fi

          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"
          BUILD_ARGS=(-scheme "$SCHEME" -configuration "$CONFIGURATION" -sdk iphoneos -derivedDataPath "$DERIVED_DATA_PATH" -destination "generic/platform=iOS")
          if [[ -n "$WORKSPACE_PATH" ]]; then
            BUILD_ARGS=(-workspace "$APP_DIR/$WORKSPACE_PATH" "${BUILD_ARGS[@]}")
          else
            BUILD_ARGS=(-project "$APP_DIR/$PROJECT_PATH" "${BUILD_ARGS[@]}")
          fi

          xcodebuild "${BUILD_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"
          echo "DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"
          echo "BUILD_PRODUCTS_DIR=$DERIVED_DATA_PATH/Build/Products/${CONFIGURATION}-iphoneos" >> "$GITHUB_ENV"

      - name: Locate exactly one built app and read metadata
        shell: bash
        env:
          EXPECTED_APP_NAME: ${{ inputs.app_name }}
          EXPECTED_APP_VERSION: ${{ inputs.app_version }}
          EXPECTED_BUILD_NUMBER: ${{ inputs.build_number }}
          FALLBACK_MINIMUM_OS_VERSION: ${{ inputs.minimum_os_version }}
        run: |
          set -euo pipefail
          candidates=()
          for candidate in "$BUILD_PRODUCTS_DIR"/*.app; do
            if [[ -d "$candidate" ]]; then
              candidates+=("$candidate")
            fi
          done

          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "Expected exactly one root app bundle, found ${#candidates[@]}" >&2
            printf '%s\n' "${candidates[@]}" >&2
            exit 1
          fi

          app_path="${candidates[0]}"
          app_name="$(basename "$app_path")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          minimum_os_version="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app_path/Info.plist" 2>/dev/null || true)"
          if [[ -z "$minimum_os_version" ]]; then
            minimum_os_version="$FALLBACK_MINIMUM_OS_VERSION"
          fi

          [[ -n "$bundle_id" ]] || { echo "Built app has no bundle identifier" >&2; exit 1; }
          [[ -n "$app_version" ]] || { echo "Built app has no app version" >&2; exit 1; }
          [[ -n "$build_number" ]] || { echo "Built app has no build number" >&2; exit 1; }
          [[ -n "$minimum_os_version" ]] || { echo "Built app has no minimum OS version" >&2; exit 1; }
          if [[ -n "$EXPECTED_APP_NAME" && "$app_name" != "$EXPECTED_APP_NAME" ]]; then
            echo "Built app name '$app_name' does not match expected '$EXPECTED_APP_NAME'" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_APP_VERSION" && "$app_version" != "$EXPECTED_APP_VERSION" ]]; then
            echo "Built app version '$app_version' does not match expected '$EXPECTED_APP_VERSION'" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_BUILD_NUMBER" && "$build_number" != "$EXPECTED_BUILD_NUMBER" ]]; then
            echo "Built build number '$build_number' does not match expected '$EXPECTED_BUILD_NUMBER'" >&2
            exit 1
          fi

          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"
          echo "APP_NAME=$app_name" >> "$GITHUB_ENV"
          echo "BUNDLE_IDENTIFIER=$bundle_id" >> "$GITHUB_ENV"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "MINIMUM_OS_VERSION=$minimum_os_version" >> "$GITHUB_ENV"

      - name: Package and validate unsigned IPA
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          IPA_PATH="$RUNNER_TEMP/${ARTIFACT_NAME}.ipa"
          bash foundation/scripts/package_ipa.sh "$APP_PATH" "$IPA_PATH"
          python3 foundation/scripts/validate_ipa.py "$IPA_PATH" | tee "$RUNNER_TEMP/ipa-validation.json"
          IPA_SHA256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IPA_FILE_NAME=$(basename "$IPA_PATH")" >> "$GITHUB_ENV"
          echo "IPA_SHA256=$IPA_SHA256" >> "$GITHUB_ENV"

      - name: Write and validate build manifest
        shell: bash
        env:
          FOUNDATION_REPOSITORY: ${{ inputs.foundation_repository }}
          FOUNDATION_REF: ${{ inputs.foundation_ref }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/manifest-venv"
          "$RUNNER_TEMP/manifest-venv/bin/python" -m pip install --quiet --disable-pip-version-check --no-input 'jsonschema==4.23.0'
          "$RUNNER_TEMP/manifest-venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commitSha": os.environ["GITHUB_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "xcodeVersion": os.environ["XCODE_VERSION"],
              "runnerImage": os.environ["RUNNER_IMAGE"],
              "foundationRepository": os.environ["FOUNDATION_REPOSITORY"],
              "foundationRef": os.environ["FOUNDATION_REF"],
              "scheme": os.environ["SCHEME"],
              "configuration": os.environ["CONFIGURATION"],
              "bundleIdentifier": os.environ["BUNDLE_IDENTIFIER"],
              "appVersion": os.environ["APP_VERSION"],
              "buildNumber": os.environ["BUILD_NUMBER"],
              "minimumOSVersion": os.environ["MINIMUM_OS_VERSION"],
              "ipaFileName": os.environ["IPA_FILE_NAME"],
              "ipaSha256": os.environ["IPA_SHA256"],
              "signed": False,
              "buildTimestampUtc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path(os.environ["RUNNER_TEMP"], "build-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          "$RUNNER_TEMP/manifest-venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("foundation/schemas/build-manifest.schema.json").read_text(encoding="utf-8"))
          manifest_path = Path(os.environ["RUNNER_TEMP"], "build-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(manifest)
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload validated IPA and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ runner.temp }}/${{ inputs.artifact_name }}.ipa
            ${{ runner.temp }}/build-manifest.json
          if-no-files-found: error
